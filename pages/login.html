<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Login – HAMA LOGISTICS</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="logo">
        <span class="logo-mark"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span>
        HAMA <span>LOGISTICS</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li style="margin-left:0.5rem;"><a href="login.html" class="btn btn-primary btn-sm">Login</a></li>
      </ul>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>
  <section class="form-section">
    <div class="form-card">
      <div class="portal-brand">
        <span class="logo-mark"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span>
        <strong>HAMA <span>LOGISTICS</span></strong>
        <span class="portal-tag"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Customer portal</span>
      </div>
      <h2>Customer sign in</h2>
      <p class="subtitle">Book services, pay, and manage your reservations</p>
      <div id="errorMsg" class="form-error" style="display:none;text-align:center;margin-bottom:1rem;"></div>
      <form id="loginForm">
        <div class="form-group"><label>Email</label><input type="email" name="email" required placeholder="you@example.com" /></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required placeholder="Your password" /></div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">Sign in</button>
      </form>
      <p class="form-footer">New customer? <a href="register.html">Create an account</a></p>
      <p class="form-footer" style="margin-top:0.4rem;font-size:0.82rem;">Admin / staff? <a href="../admin/login.html">Use the admin login</a></p>
    </div>
  </section>
  <p class="powered-by text-center" style="padding:1rem;font-size:0.85rem;color:#64748b;">Powered by <strong>Hama Info Tech</strong></p>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script>
    if (getSession()) window.location.href = 'dashboard.html';
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Signing in...';
      const fd = new FormData(e.target);
      try {
        await Api.login(fd.get('email'), fd.get('password'));
        window.location.href = 'dashboard.html';
      } catch (apiErr) {
        const result = loginUser(fd.get('email'), fd.get('password'));
        if (result.ok) window.location.href = 'dashboard.html';
        else {
          err.textContent = apiErr.message || result.error || 'Login failed';
          err.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Sign in';
        }
      }
    });
  </script>
</body>
</html>
