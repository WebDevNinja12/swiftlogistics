<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – HAMA LOGISTICS</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <section class="form-section" style="min-height:100vh;display:flex;align-items:center;">
    <div class="form-card">
      <h2><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg> Admin login</h2>
      <p class="subtitle">HAMA LOGISTICS operations</p>
      <div id="errorMsg" class="form-error" style="display:none;text-align:center;margin-bottom:1rem;"></div>
      <form id="adminLoginForm">
        <div class="form-group"><label>Admin email</label><input type="email" name="email" required value="admin@swiftlogistics.com" /></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required value="Admin@123" /></div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="adminBtn">Login as admin</button>
      </form>
      <p class="form-footer" style="font-size:0.85rem;">Demo credentials pre-filled.</p>
      <p class="form-footer"><a href="../index.html">Back to website</a></p>
    </div>
  </section>
  <p class="powered-by text-center" style="padding:1rem;font-size:0.85rem;color:#64748b;">Powered by <strong>Hama Info Tech</strong></p>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (getAdminSession()) window.location.href = 'dashboard.html';
    document.getElementById('adminLoginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('adminBtn');
      const err = document.getElementById('errorMsg');
      err.style.display = 'none'; btn.disabled = true;
      const fd = new FormData(e.target);
      try {
        await Api.adminLogin(fd.get('email'), fd.get('password'));
        window.location.href = 'dashboard.html';
      } catch (apiErr) {
        const result = loginAdmin(fd.get('email'), fd.get('password'));
        if (result.ok) window.location.href = 'dashboard.html';
        else { err.textContent = apiErr.message || result.error; err.style.display = 'block'; btn.disabled = false; }
      }
    });
  </script>
</body>
</html>
